# MSIX/AppX investigation config (REQ-20260615-069 Phase 0).
#
# Intentionally a separate file from `electron-builder.yml` so the production
# NSIS pipeline (`npm run build:win`) is unaffected.  Invoke explicitly:
#
#   npm run build && npx electron-builder --win appx --config electron-builder-appx.yml
#
# The `extraResources` block is duplicated from electron-builder.yml because
# electron-builder has no native config inheritance.  Keep the two files in
# sync if either changes; this file should be deleted once Phase 0/1 wraps.
appId: com.brightryo.mojioko
productName: MOJIOKO
copyright: "Copyright © 2026 BrightRyo"

directories:
  buildResources: build
  output: dist-appx

files:
  - out/**/*
  - "!out/**/*.map"

# REQ-0463 — unpack the MCP clean-stdout proxy + its shared chunk so it can be
# run as a plain Node entry point (ELECTRON_RUN_AS_NODE) from app.asar.unpacked.
# Kept in sync with electron-builder.yml (NSIS) and -appx-store.yml; see the
# fuller rationale there.  Pinned by tests/unit/mcp-proxy-unpack-req-0463.test.ts.
asarUnpack:
  - "out/main/mcp-proxy.js"
  - "out/main/chunks/**"

extraResources:
  - from: resources/bin/ffmpeg
    to: bin/ffmpeg
    filter:
      - "ffmpeg.exe"
      - "ffprobe.exe"
      - "*.dll"
  - from: resources/bin/transcriber
    to: bin/transcriber
    filter:
      - "**/*"
  - from: resources/fonts
    to: fonts
    filter:
      - "**/*.ttf"
      - "**/OFL.txt"
      - "**/LICENSE*"
  - from: python-sidecar
    to: python-sidecar
    filter:
      - "main.py"
      - "requirements.txt"
  - from: installer/licenses
    to: licenses
  # REQ-0258 — MOJIOKO EULA text shipped inside the packaged MSIX so
  # the About > "View EULA" button can read it via
  # <resourcesPath>/eula/license_<lang>.txt.  MSIX has no install-time
  # EULA hook (see electron-builder.yml comment), so the in-app dialog
  # is the sole path.  Kept in sync with the NSIS side.
  - from: build
    to: eula
    filter:
      - "license_ja.txt"
      - "license_en.txt"
  - from: build
    to: icons
    filter:
      - "icon.ico"

# REQ-0459 §2 — declare the `.mojioko` file-type association so the MSIX/AppX
# manifest carries a windows.fileTypeAssociation extension (double-click opens
# the project). electron-builder generates the FileTypeAssociation from this.
# Kept in sync with electron-builder.yml (NSIS side).
fileAssociations:
  - ext: mojioko
    name: MOJIOKO Project
    description: MOJIOKO subtitle project
    icon: build/icon.ico
    role: Editor

win:
  target:
    - target: appx
      arch: x64
  icon: build/icon.ico
  # REQ-0580 §1-1 — the self-signed sideload signing step is removed.
  # AppX signing never actually established on this machine (RES-0572 §6-a),
  # and sideload verification is done via loose registration
  # (Add-AppxPackage -Register on the unpacked layout) instead, so the
  # `certificateFile` / `certificatePassword` pair here bought nothing but a
  # plaintext credential in a public repo (RES-0579 B).  Removed entirely.
  # If real sideload signing is ever needed, pass CSC_LINK / CSC_KEY_PASSWORD
  # via the environment (electron-builder reads them) — never inline.

# AppX-specific options.
#
# Identity / publisher values here are **dev / sideload placeholders** — when
# Phase 1 begins and a Microsoft Partner Center submission is created, both
# identityName and publisher must be replaced with the values Partner Center
# assigns under "App identity" (typically `XXXXX.AppName` and a long
# `CN=<GUID>` publisher).  See:
#   https://learn.microsoft.com/windows/apps/publish/publish-your-app/msix/app-package-requirements
#
# The current publisher `CN=brightryo` is what the self-signed dev cert below
# must use as its Subject — Identity.Publisher in the manifest must match the
# cert Subject exactly, otherwise Add-AppxPackage fails with
# `0x800B0109 / 0x80073CF3`.
appx:
  identityName: brightryo.MOJIOKO
  publisher: CN=brightryo
  publisherDisplayName: brightryo
  applicationId: MOJIOKO
  # REQ-090 — green brand colour to match the tile PNGs in build/appx/.
  # See electron-builder-appx-store.yml for the full rationale; same
  # change applied to both files so sideload and Store builds match.
  backgroundColor: "#23C55E"
  displayName: MOJIOKO
  languages:
    - ja-jp
    - en-us
  # Disable the auto-update extension; we'll let the Store handle updates and
  # the sideload PoC has no AppInstaller manifest anyway.
  addAutoLaunchExtension: false
  electronUpdaterAware: false

publish: null
